<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg-gradient)"/>
  
  <!-- Download Arrow -->
  <path d="M256 120 v190" stroke="#ffffff" stroke-width="48" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
  <path d="M170 230 l86 86 l86 -86" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)"/>
  
  <!-- Bottom Line -->
  <path d="M150 400 h212" stroke="#ffffff" stroke-width="48" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
</svg>

