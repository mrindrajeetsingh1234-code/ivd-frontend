<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Indrajeet Video Downloader</title>
    <style>
        :root { --bg: #fff; --text: #000; --accent: #ff0000; }
        [data-theme="youtube"] { --bg: #0f0f0f; --text: #fff; --accent: #ff0000; }
        body { background: var(--bg); color: var(--text); font-family: Arial; }
        .search-box { display: flex; position: relative; width: 80%; margin: auto; }
        .search-input { width: 100%; padding: 10px; }
        .clear-btn { position: absolute; right: 10px; top: 5px; cursor: pointer; display: none; }
        .progress-box { display: none; margin-top: 20px; }
        .progress-bar { height: 20px; background: var(--accent); width: 0%; transition: 0.3s; }
        .dl-action-btn { background: var(--accent); color: #fff; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <header><h1>Indrajeet Video Downloader</h1></header>

    <button onclick="switchTheme('default')">Default Theme</button>
    <button onclick="switchTheme('youtube')">YouTube Theme</button>

    <div class="search-box">
        <input type="text" id="video-url" class="search-input" placeholder="Paste URL here..." oninput="toggleClearBtn()">
        <button id="clear-btn" class="clear-btn" onclick="clearInput()">X</button>
        <button onclick="checkVideoInfo()">Search</button>
    </div>

    <div id="ads-container">
        </div>

    <div id="loader" style="display:none;">Loading...</div>
    <div id="result-container" style="display:none;">
        <h2 id="video-title"></h2>
        <img id="video-thumb" style="width:300px; display:none;">
        <table id="quality-list"></table>
    </div>

    <div id="progress-box" class="progress-box">
        <div id="status-message">Server par process ho raha hai...</div>
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <footer><p>&copy; Indrajeet Soni</p></footer>

    <script>
        function switchTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }
        function toggleClearBtn() { document.getElementById('clear-btn').style.display = document.getElementById('video-url').value ? 'block' : 'none'; }
        function clearInput() { document.getElementById('video-url').value = ''; toggleClearBtn(); }
        
        const BACKEND_URL = "https://indrajeet-video-downloader.onrender.com";

        async function checkVideoInfo() {
            const url = document.getElementById('video-url').value.trim();
            document.getElementById('loader').style.display = 'block';
            try {
                const res = await fetch(BACKEND_URL + '/check_info', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                const data = await res.json();
                document.getElementById('loader').style.display = 'none';
                if(data.success) {
                    document.getElementById('video-title').innerText = data.title;
                    document.getElementById('video-thumb').src = data.thumb;
                    document.getElementById('video-thumb').style.display = 'block';
                    const qList = document.getElementById('quality-list');
                    qList.innerHTML = '';
                    data.qualities.forEach(q => {
                        qList.innerHTML += `<tr><td>${q}</td><td><button class="dl-action-btn" onclick="startDownload('${q}')">Download</button></td></tr>`;
                    });
                    document.getElementById('result-container').style.display = 'block';
                }
            } catch(e) { alert("Error!"); document.getElementById('loader').style.display = 'none'; }
        }

        async function startDownload(q) {
            const url = document.getElementById('video-url').value.trim();
            document.getElementById('progress-box').style.display = 'block';
            document.getElementById('status-message').innerText = "Downloading...";
            document.getElementById('progress-bar').style.width = "50%";
            
            const res = await fetch(BACKEND_URL + '/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: url})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('progress-bar').style.width = "100%";
                const link = document.createElement('a');
                link.href = BACKEND_URL + "/files/" + encodeURIComponent(data.filename);
                link.setAttribute('download', data.filename);
                document.body.appendChild(link);
                link.click();
                link.remove();
                document.getElementById('status-message').innerText = "Complete!";
            }
        }
    </script>
</body>
</html>
