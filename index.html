<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
    </head>
<body>
    <script>
        const BACKEND_URL = "https://indrajeet-video-downloader.onrender.com";

        // ❌ क्रॉस बटन के लिए फंक्शन
        function toggleClearBtn() { 
            document.getElementById('clear-btn').style.display = document.getElementById('video-url').value.trim().length > 0 ? 'block' : 'none'; 
        }
        function clearInput() { 
            document.getElementById('video-url').value = ''; 
            toggleClearBtn(); 
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('progress-box').style.display = 'none';
        }

        // 🎬 वीडियो की जानकारी लाना
        async function fetchVideoData() {
            let url = document.getElementById('video-url').value.trim();
            if(!url) return alert("Please paste a link!");
            
            document.getElementById('platforms-grid').style.display = 'none';
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            
            try {
                const res = await fetch(BACKEND_URL + '/check_info', {
                    method: 'POST',
                    body: JSON.stringify({url}),
                    headers:{'Content-Type':'application/json'}
                });
                const data = await res.json();
                document.getElementById('loader').style.display = 'none';
                
                if(data.success) {
                    document.getElementById('result-container').style.display = 'block';
                    document.getElementById('video-thumb').src = data.thumb || 'https://via.placeholder.com/380x214';
                    document.getElementById('video-title').innerText = data.title || 'Ready to Download';
                    
                    let tbody = document.getElementById('quality-list');
                    tbody.innerHTML = '';
                    
                    let realQualities = data.qualities || ['1080p (.mp4)', 'Audio (.mp3)'];
                    realQualities.forEach(q => {
                        let tr = document.createElement('tr');
                        // 📢 ADS TAGS के साथ डाउनलोड बटन
                        tr.innerHTML = `<td><strong>${q}</strong></td>
                                        <td>${q.includes('Audio') ? "MP3" : "MP4"}</td>
                                        <td>
                                            <div onclick="window.open('https://YOUR_ADS_LINK', '_blank')"> 
                                                <button class="dl-action-btn" onclick="startRealDownload('${url}', '${q}')">Download</button>
                                            </div>
                                        </td>`;
                        tbody.appendChild(tr);
                    });
                } else {
                    alert("Error: " + data.error);
                    document.getElementById('platforms-grid').style.display = 'block';
                }
            } catch(e) {
                document.getElementById('loader').style.display = 'none';
                alert("Network Error!");
            }
        }

        // 🚀 डाउनलोड का पक्का तरीका (ProgressBar + Force Download)
        function startRealDownload(url, qType) {
            let pBox = document.getElementById('progress-box');
            let pBar = document.getElementById('progress-bar');
            let pText = document.getElementById('progress-text');
            let statusMsg = document.getElementById('status-message');
            
            pBox.style.display = 'block';
            pBar.style.width = '0%';
            pText.innerText = '0%';
            statusMsg.innerText = `Downloading ${qType}... Please wait.`;
            
            let progress = 0;
            let interval = setInterval(() => {
                if(progress < 90) progress += 5;
                pBar.style.width = progress + '%';
                pText.innerText = progress + '%';
            }, 1000);

            fetch(BACKEND_URL + '/download', {
                method: 'POST',
                body: JSON.stringify({url, quality: qType}),
                headers:{'Content-Type':'application/json'}
            })
            .then(res => res.json())
            .then(data => {
                clearInterval(interval);
                if(data.success && data.filename) {
                    pBar.style.width = '100%';
                    pText.innerText = '100%';
                    statusMsg.innerText = "Download Success!";
                    
                    // 📥 ब्राउज़र को मजबूर करना कि फाइल डाउनलोड हो (प्ले न हो)
                    const a = document.createElement('a');
                    a.href = BACKEND_URL + "/files/" + encodeURIComponent(data.filename);
                    a.setAttribute('download', data.filename);
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    statusMsg.innerText = "Download Failed: " + data.error;
                }
            })
            .catch(() => {
                clearInterval(interval);
                statusMsg.innerText = "Server Busy!";
            });
        }
    </script>
</body>
</html>
